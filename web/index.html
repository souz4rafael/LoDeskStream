<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoDeskStream</title>
  <link rel="icon" href="/lodeskstream-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#121212">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #121212;
      color: #e8e8e8;
      font: 14px/1.4 Segoe UI, sans-serif;
    }
    header { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #2c2c2c; flex-wrap: wrap; }
    header.in-stage-menu {
      padding: 0;
      border: 0;
      background: transparent;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      justify-content: center;
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
    .brand svg { width: 20px; height: 20px; display: block; }
    input, button, select { background: #1f1f1f; color: #e8e8e8; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 8px; }
    button { cursor: pointer; }
    #controlsBar button {
      box-sizing: border-box;
      width: 84px;
      min-height: 56px;
      flex: 0 0 84px;
      padding: 8px 4px;
      font: 13px/18px Segoe UI, sans-serif;
      white-space: pre-line;
      text-align: center;
      touch-action: manipulation;
    }
    #controlsBar input, #controlsBar select {
      box-sizing: border-box;
      min-height: 56px;
      min-width: 0;
      max-width: 100%;
    }
    #token { width: 156px; }
    #monitorPanel {
      flex: 1 0 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      box-sizing: border-box;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #181818;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    #controlsBar .monitor-option {
      width: 180px;
      flex: 1 1 160px;
      white-space: normal;
      overflow-wrap: break-word;
    }
    #controlsBar .monitor-option[aria-pressed="true"] {
      background: #164e3b;
      border-color: #34d399;
    }
    #controlsBar button:disabled { opacity: 0.5; cursor: default; }
    #fullMouse[aria-pressed="true"] { background: #164e3b; border-color: #34d399; }
    #status { color: #ff8c8c; }
    main {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      box-sizing: border-box;
    }
    #stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      outline: none;
      touch-action: none;
    }
    #viewer, #fallbackViewer {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      object-fit: contain;
      border: 1px solid #2c2c2c;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      background: #000;
      outline: none;
      margin: auto;
    }
    #mobileKeyboard {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: 0;
      padding: 0;
      pointer-events: none;
      resize: none;
    }
    .hidden { display: none !important; }
    #remoteCursor {
      position: absolute;
      display: none;
      width: 30px;
      height: 30px;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #stageMenu {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 48px;
      height: 56px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
      touch-action: none;
    }
    #stageMenu:not(.fullscreen-active) { display: none; }
    #stageMenu.dragging { opacity: 0.86; }
    #stageMenuToggle {
      width: 48px;
      height: 56px;
      padding: 0;
      border-color: #4a4a4a;
      background: rgba(20, 20, 20, 0.82);
      font-size: 20px;
      line-height: 1;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      cursor: grab;
      flex: 0 0 56px;
    }
    #stageMenu.dragging #stageMenuToggle { cursor: grabbing; }
    #stageMenuPanel {
      display: none;
      position: absolute;
      top: 64px;
      right: 0;
      width: 980px;
      max-width: calc(100vw - 20px);
      box-sizing: border-box;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      background: rgba(18, 18, 18, 0.92);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
      pointer-events: auto;
      backdrop-filter: blur(10px);
      animation: slideDown 140ms ease-out;
    }
    #stageMenu.open #stageMenuPanel { display: block; }
    @keyframes slideDown {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .note {
      color: #b7b7b7;
      margin-left: auto;
      min-width: 0;
      max-width: 520px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header id="controlsBar">
    <span class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect x="6" y="10" width="52" height="36" rx="8" fill="#0f172a" stroke="url(#brandGradient)" stroke-width="3"/>
        <path d="M14 34 L24 24 L31 31 L42 20 L50 28" fill="none" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="50" width="24" height="4" rx="2" fill="#94a3b8"/>
        <rect x="28" y="46" width="8" height="4" rx="2" fill="#94a3b8"/>
      </svg>
      LoDeskStream
    </span>
    <input id="token" type="password" placeholder="STREAM_TOKEN">
    <button id="connect" type="button" aria-pressed="false">Connect</button>
    <button id="monitorToggle" type="button" aria-expanded="false" aria-controls="monitorPanel" disabled>Choose&#10;monitor</button>
    <button id="streamMode" type="button" title="Switch between WebRTC and MJPEG (MJPEG has no audio)">Mode:&#10;WebRTC</button>
    <button id="fullscreen">Full&#10;screen</button>
    <button id="muteAudio">Mute&#10;audio</button>
    <button id="showKeyboard" disabled>Show&#10;keyboard</button>
    <button id="fullMouse" type="button" aria-pressed="false" title="Enable continuous mouse movement and click-and-drag">Full mouse:&#10;Off</button>
    <span id="status">Disconnected</span>
    <select id="monitor" hidden aria-hidden="true" tabindex="-1"></select>
    <div id="monitorPanel" class="hidden" role="group" aria-label="Choose monitor"></div>
  </header>
  <main>
    <div id="stage" tabindex="0">
      <video id="viewer" autoplay playsinline tabindex="0"></video>
      <img id="fallbackViewer" class="hidden" alt="Desktop stream" tabindex="0">
      <textarea id="mobileKeyboard" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" tabindex="-1" aria-label="Remote keyboard input"></textarea>
      <svg id="remoteCursor" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="#fff" fill-opacity="0.19" stroke="#000" stroke-opacity="0.63" stroke-width="2"/>
        <circle cx="15" cy="15" r="12" fill="none" stroke="#fff" stroke-opacity="0.82" stroke-width="2"/>
        <circle cx="15" cy="15" r="2" fill="#fff" fill-opacity="0.9" stroke="#000" stroke-opacity="0.78"/>
      </svg>
      <div id="stageMenu">
        <button id="stageMenuToggle" title="Show controls" aria-label="Show controls" aria-expanded="false">☰</button>
        <div id="stageMenuPanel"></div>
      </div>
    </div>
  </main>

  <script src="/input-queue.js"></script>
  <script src="/keyboard-input.js"></script>
  <script>
    const viewer = document.getElementById("viewer");
    const fallbackViewer = document.getElementById("fallbackViewer");
    const controlsBar = document.getElementById("controlsBar");
    const mainEl = document.querySelector("main");
    const stage = document.getElementById("stage");
    const mobileKeyboard = document.getElementById("mobileKeyboard");
    const remoteCursor = document.getElementById("remoteCursor");
    const statusEl = document.getElementById("status");
    const tokenEl = document.getElementById("token");
    const connectBtn = document.getElementById("connect");
    const fullscreenBtn = document.getElementById("fullscreen");
    const muteAudioBtn = document.getElementById("muteAudio");
    const streamModeBtn = document.getElementById("streamMode");
    const showKeyboardBtn = document.getElementById("showKeyboard");
    const monitorEl = document.getElementById("monitor");
    const monitorToggle = document.getElementById("monitorToggle");
    const monitorPanel = document.getElementById("monitorPanel");
    let monitorButtons = [];
    const fullMouseEl = document.getElementById("fullMouse");
    const stageMenu = document.getElementById("stageMenu");
    const stageMenuToggle = document.getElementById("stageMenuToggle");
    const stageMenuPanel = document.getElementById("stageMenuPanel");
    let token = "";
    let lastMoveAt = 0;
    let connected = false;
    let monitorsLoaded = false;
    let peerConnection = null;
    let usingWebRtc = false;
    let preferWebRtc = true;
    let audioMuted = false;
    let menuDrag = null;
    let remoteDrag = null;
    let remoteCursorTimer = 0;
    let lastRemotePoint = null;
    let lastTouchAt = -Infinity;
    let controlSessionId = "";
    let heartbeatTimer = 0;
    let connectionGeneration = 0;
    let inputQueue = null;
    const remoteKeyboard = new RemoteKeyboard((payload) => sendEvent(payload));
    let connectionState = "disconnected";
    let streamGeneration = 0;
    let videoWatchdogTimer = 0;
    let remoteAudioAvailable = false;

    function status(msg, ok = true) {
      statusEl.textContent = msg;
      statusEl.style.color = ok ? "#9cd67a" : "#ff8c8c";
    }

    function renderConnectionControls() {
      const busy = connectionState === "connecting" || connectionState === "switching";
      connectBtn.disabled = busy;
      connectBtn.textContent = busy
        ? (connectionState === "switching" ? "Switching..." : "Connecting...")
        : (connected ? "Disconnect" : "Connect");
      connectBtn.setAttribute("aria-pressed", String(connected));
      connectBtn.setAttribute("aria-busy", String(busy));
      streamModeBtn.disabled = busy;
      tokenEl.disabled = busy;
      monitorEl.disabled = busy || !monitorsLoaded;
      monitorToggle.disabled = monitorEl.disabled;
      for (const button of monitorButtons) button.disabled = monitorEl.disabled;
      if (monitorEl.disabled) setMonitorPanelOpen(false);
      fullMouseEl.disabled = busy;
      showKeyboardBtn.disabled = !connected || busy;
      muteAudioBtn.disabled = !connected || busy || !usingWebRtc || !remoteAudioAvailable;
    }

    function setConnectionState(state, message, ok = true) {
      connectionState = state;
      connected = state === "connected" || state === "switching" ||
        (state === "connecting" && Boolean(controlSessionId));
      renderConnectionControls();
      if (message !== undefined) status(message, ok);
    }

    function failConnection(message) {
      disconnect();
      setConnectionState("error", message, false);
    }

    async function withTimeout(promise, milliseconds, message) {
      let timeoutId = 0;
      try {
        return await Promise.race([
          promise,
          new Promise((resolve, reject) => {
            timeoutId = setTimeout(() => reject(new Error(message)), milliseconds);
          })
        ]);
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function requestJson(url, options, timeout = 10000) {
      const request = (async () => {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error((data && data.error) || `HTTP ${response.status}`);
        if (!data || !data.ok) throw new Error((data && data.error) || "Invalid server response");
        return data;
      })();
      return withTimeout(request, timeout, `Request timed out: ${url}`);
    }

    function currentStream(generation, sessionId) {
      return connected && generation === streamGeneration && sessionId === controlSessionId;
    }

    function activeViewer() {
      return usingWebRtc ? viewer : fallbackViewer;
    }

    function showWebRtcViewer() {
      usingWebRtc = true;
      remoteAudioAvailable = false;
      streamModeBtn.textContent = "Mode:\nWebRTC";
      viewer.classList.remove("hidden");
      fallbackViewer.classList.add("hidden");
      fallbackViewer.removeAttribute("src");
      renderConnectionControls();
    }

    function showFallbackViewer() {
      usingWebRtc = false;
      remoteAudioAvailable = false;
      preferWebRtc = false;
      streamModeBtn.textContent = "Mode:\nMJPEG";
      fallbackViewer.classList.remove("hidden");
      viewer.classList.add("hidden");
      viewer.pause();
      viewer.srcObject = null;
      renderConnectionControls();
    }

    function updateAudioButton() {
      viewer.muted = audioMuted;
      muteAudioBtn.textContent = audioMuted ? "Unmute\naudio" : "Mute\naudio";
    }

    function updateFullscreenButtons() {
      const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      fullscreenBtn.textContent = inFullscreen ? "Exit\nfullscreen" : "Full\nscreen";
      stageMenu.classList.toggle("fullscreen-active", Boolean(inFullscreen));
      if (!inFullscreen) {
        setStageMenuOpen(false);
      }
    }

    function setStageMenuOpen(open) {
      setMonitorPanelOpen(false);
      stageMenu.classList.toggle("open", open);
      stageMenuToggle.setAttribute("aria-expanded", String(open));
      if (open) {
        stageMenuPanel.appendChild(controlsBar);
        controlsBar.classList.add("in-stage-menu");
      } else {
        document.body.insertBefore(controlsBar, mainEl);
        controlsBar.classList.remove("in-stage-menu");
      }
      keepStageMenuInBounds();
    }

    function pinStageMenu(left, top) {
      const stageRect = stage.getBoundingClientRect();
      const menuRect = stageMenu.getBoundingClientRect();
      const maxLeft = Math.max(0, stageRect.width - menuRect.width);
      const maxTop = Math.max(0, stageRect.height - menuRect.height);
      const nextLeft = Math.min(maxLeft, Math.max(0, left));
      const nextTop = Math.min(maxTop, Math.max(0, top));
      stageMenu.style.left = `${nextLeft}px`;
      stageMenu.style.right = "auto";
      stageMenu.style.top = `${nextTop}px`;
      stageMenu.style.transform = "none";
    }

    function keepStageMenuInBounds() {
      if (!stageMenu.classList.contains("fullscreen-active")) return;
      const rect = stageMenu.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      pinStageMenu(rect.left - stageRect.left, rect.top - stageRect.top);
      if (!stageMenu.classList.contains("open")) return;
      const anchor = stageMenu.getBoundingClientRect();
      const anchorLeft = anchor.left - stageRect.left;
      const anchorTop = anchor.top - stageRect.top;
      const panelWidth = Math.min(980, Math.max(0, stageRect.width - 20));
      stageMenuPanel.style.width = `${panelWidth}px`;
      const panelLeft = Math.min(Math.max(0, anchorLeft + anchor.width - panelWidth),
        Math.max(0, stageRect.width - panelWidth));
      stageMenuPanel.style.left = `${panelLeft - anchorLeft}px`;
      stageMenuPanel.style.right = "auto";
      const below = Math.max(0, stageRect.height - anchorTop - anchor.height - 8);
      const above = Math.max(0, anchorTop - 8);
      const useAbove = stageMenuPanel.scrollHeight > below && above > below;
      stageMenuPanel.style.maxHeight = `${useAbove ? above : below}px`;
      stageMenuPanel.style.top = useAbove ? "auto" : `${anchor.height + 8}px`;
      stageMenuPanel.style.bottom = useAbove ? `${anchor.height + 8}px` : "auto";
    }

    function selectedMonitor() {
      const option = monitorEl.selectedOptions[0];
      const width = Number(option && option.dataset ? option.dataset.width : 0);
      const height = Number(option && option.dataset ? option.dataset.height : 0);
      return {
        index: selectedMonitorIndex(),
        width: Number.isFinite(width) && width > 0 ? width : 16,
        height: Number.isFinite(height) && height > 0 ? height : 9
      };
    }

    function streamContentRect() {
      const media = activeViewer();
      const borderRect = media.getBoundingClientRect();
      const rect = {
        left: borderRect.left + media.clientLeft,
        top: borderRect.top + media.clientTop,
        width: media.clientWidth,
        height: media.clientHeight
      };
      const monitor = selectedMonitor();
      const mediaWidth = usingWebRtc ? media.videoWidth : media.naturalWidth;
      const mediaHeight = usingWebRtc ? media.videoHeight : media.naturalHeight;
      const streamAspect = mediaWidth > 0 && mediaHeight > 0
        ? mediaWidth / mediaHeight : monitor.width / monitor.height;
      const viewAspect = rect.width / rect.height;
      let width = rect.width;
      let height = rect.height;
      let left = rect.left;
      let top = rect.top;
      if (viewAspect > streamAspect) {
        width = height * streamAspect;
        left += (rect.width - width) / 2;
      } else {
        height = width / streamAspect;
        top += (rect.height - height) / 2;
      }
      return { left, top, width, height };
    }

    function relativePos(event) {
      const rect = streamContentRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      if (x < 0 || y < 0 || x > 1 || y > 1) return null;
      return {
        x,
        y
      };
    }

    function selectedMonitorIndex() {
      const index = Number(monitorEl.value);
      return Number.isFinite(index) && index > 0 ? index : 1;
    }

    function fullMouseEnabled() {
      return fullMouseEl.getAttribute("aria-pressed") === "true";
    }

    fullMouseEl.addEventListener("click", () => {
      const enabled = !fullMouseEnabled();
      if (!enabled) finishRemoteDrag(null);
      fullMouseEl.setAttribute("aria-pressed", String(enabled));
      fullMouseEl.textContent = enabled ? "Full mouse:\nOn" : "Full mouse:\nOff";
      clearTimeout(remoteCursorTimer);
    });

    function focusMobileKeyboard() {
      if (!connected) return;
      mobileKeyboard.value = "";
      mobileKeyboard.focus();
    }

    showKeyboardBtn.addEventListener("click", focusMobileKeyboard);

    function sendTextInput(value) {
      if (!value) return;
      const normalized = value.replace(/\r\n/g, "\n");
      const parts = normalized.split("\n");
      for (let i = 0; i < parts.length; i += 1) {
        if (parts[i]) {
          sendEvent({ type: "text", text: parts[i] });
        }
        if (i < parts.length - 1) {
          sendEvent({ type: "key", key: "enter", action: "tap" });
        }
      }
    }

    function createInputQueue(sessionId, sessionToken) {
      const queue = new InputQueue(async (body) => {
        const response = await fetch("/api/input", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Auth-Token": sessionToken, "X-Session-ID": sessionId },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          throw new Error(data.error || `HTTP ${response.status}`);
        }
      }, (error) => {
        if (controlSessionId !== sessionId || inputQueue !== queue) return;
        failConnection(`Input channel error: ${error.message}`);
      });
      return queue;
    }

    function sendEvent(payload) {
      if (!token || !connected || !controlSessionId || !inputQueue) return Promise.resolve(false);
      return inputQueue.enqueue(Object.assign({ monitorIndex: selectedMonitorIndex() }, payload));
    }

    async function closeControlSession(sessionId, sessionToken) {
      try {
        const response = await fetch("/api/session", {
          method: "DELETE",
          headers: { "X-Auth-Token": sessionToken, "X-Session-ID": sessionId },
          keepalive: true
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      } catch (error) {
        console.warn("Session close failed; server timeout will release held input", error);
      }
    }

    function scheduleHeartbeat(sessionId, sessionToken) {
      heartbeatTimer = setTimeout(async () => {
        let timeoutId = 0;
        try {
          const response = await Promise.race([
            fetch("/api/session/heartbeat", {
              method: "POST",
              headers: { "X-Auth-Token": sessionToken, "X-Session-ID": sessionId }
            }),
            new Promise((resolve, reject) => {
              timeoutId = setTimeout(() => reject(new Error("Heartbeat timed out")), 5000);
            })
          ]);
          if (!response.ok) throw new Error(`Heartbeat failed: HTTP ${response.status}`);
          if (controlSessionId === sessionId) scheduleHeartbeat(sessionId, sessionToken);
        } catch (error) {
          if (controlSessionId === sessionId) {
            failConnection(`Control session lost: ${error.message}. Reconnect.`);
          }
        } finally {
          clearTimeout(timeoutId);
        }
      }, 5000);
    }

    function setMjpegStreamSource(generation = streamGeneration) {
      showFallbackViewer();
      const sessionId = controlSessionId;
      const url = `/stream?token=${encodeURIComponent(token)}&monitor=${selectedMonitorIndex()}&ts=${Date.now()}`;
      stage.scrollTop = 0;
      stage.scrollLeft = 0;
      fallbackViewer.removeAttribute("src");
      requestAnimationFrame(() => {
        if (currentStream(generation, sessionId) && !usingWebRtc) fallbackViewer.src = url;
      });
    }

    function closePeerConnection() {
      clearTimeout(videoWatchdogTimer);
      if (!peerConnection) return;
      peerConnection.ontrack = null;
      peerConnection.onconnectionstatechange = null;
      peerConnection.close();
      peerConnection = null;
    }

    async function waitForIceGatheringComplete(pc) {
      if (pc.iceGatheringState === "complete") return;
      await new Promise((resolve) => {
        let timeoutId = 0;
        const checkState = () => {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", checkState);
            clearTimeout(timeoutId);
            resolve();
          }
        };
        pc.addEventListener("icegatheringstatechange", checkState);
        timeoutId = setTimeout(() => {
          pc.removeEventListener("icegatheringstatechange", checkState);
          resolve();
        }, 1500);
      });
    }

    async function startWebRtcStream(generation, sessionId) {
      closePeerConnection();
      showWebRtcViewer();
      updateAudioButton();

      const pc = new RTCPeerConnection({ iceServers: [] });
      peerConnection = pc;
      const remoteStream = new MediaStream();
      viewer.srcObject = remoteStream;

      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });
      pc.ontrack = (event) => {
        if (currentStream(generation, sessionId) && peerConnection === pc) remoteStream.addTrack(event.track);
      };
      pc.onconnectionstatechange = () => {
        if (currentStream(generation, sessionId) && peerConnection === pc &&
            (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
          failConnection("WebRTC connection lost");
        }
      };

      const offer = await withTimeout(pc.createOffer(), 10000, "WebRTC offer timed out");
      if (!currentStream(generation, sessionId) || peerConnection !== pc) return;
      await withTimeout(pc.setLocalDescription(offer), 10000, "WebRTC setup timed out");
      await waitForIceGatheringComplete(pc);
      if (!currentStream(generation, sessionId) || peerConnection !== pc) return;

      const answer = await requestJson("/webrtc/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Auth-Token": token },
        body: JSON.stringify({
          type: pc.localDescription.type,
          sdp: pc.localDescription.sdp,
          monitor: selectedMonitorIndex(),
          audio: true
        })
      }, 25000);
      if (!currentStream(generation, sessionId) || peerConnection !== pc) return;
      await withTimeout(pc.setRemoteDescription({ type: answer.type, sdp: answer.sdp }), 10000, "WebRTC answer timed out");
      if (!currentStream(generation, sessionId) || peerConnection !== pc) return;

      try {
        await withTimeout(viewer.play(), 3500, "WebRTC playback timed out");
      } catch (error) {
        if (!currentStream(generation, sessionId) || peerConnection !== pc) return;
        audioMuted = true;
        updateAudioButton();
        await withTimeout(viewer.play(), 3500, "WebRTC playback timed out");
      }

      if (!currentStream(generation, sessionId) || peerConnection !== pc) return;
      remoteAudioAvailable = Boolean(answer.audio);
      const audioSuffix = answer.audio ? " + audio" : " video only";
      status(`Connected (WebRTC${audioSuffix})${answer.audioError ? " - audio unavailable" : ""}`);
      videoWatchdogTimer = setTimeout(function () {
        if (currentStream(generation, sessionId) && peerConnection === pc && usingWebRtc && (!viewer.videoWidth || !viewer.videoHeight)) {
          console.warn("WebRTC connected without visible video, falling back to MJPEG");
          closePeerConnection();
          setMjpegStreamSource(generation);
          setConnectionState("connected", "Connected (MJPEG fallback - no audio)");
        }
      }, 3500);
    }

    async function startSelectedStream() {
      const sessionId = controlSessionId;
      const generation = ++streamGeneration;
      if (!preferWebRtc) {
        closePeerConnection();
        setMjpegStreamSource(generation);
        setConnectionState("connected", "Connected (MJPEG - no audio)");
        return;
      }
      try {
        await startWebRtcStream(generation, sessionId);
        if (currentStream(generation, sessionId)) setConnectionState("connected");
      } catch (error) {
        if (!currentStream(generation, sessionId)) return;
        console.warn("WebRTC failed, falling back to MJPEG", error);
        closePeerConnection();
        setMjpegStreamSource(generation);
        setConnectionState("connected", "Connected (MJPEG fallback - no audio)");
      }
    }

    streamModeBtn.addEventListener("click", async () => {
      if (connectionState === "connecting" || connectionState === "switching") return;
      preferWebRtc = !preferWebRtc;
      streamModeBtn.textContent = preferWebRtc ? "Mode:\nWebRTC" : "Mode:\nMJPEG";
      if (!connected) return;
      finishRemoteDrag(null);
      remoteKeyboard.releaseAll();
      setConnectionState("switching", "Switching stream...");
      const generation = connectionGeneration;
      try {
        await startSelectedStream();
      } catch (error) {
        if (generation === connectionGeneration) failConnection(`Stream switch failed: ${error.message}`);
      }
    });

    function disconnect() {
      setMonitorPanelOpen(false);
      remoteDrag = null;
      remoteKeyboard.clear();
      if (inputQueue) inputQueue.stop();
      inputQueue = null;
      connectionGeneration += 1;
      streamGeneration += 1;
      clearTimeout(heartbeatTimer);
      const sessionId = controlSessionId;
      controlSessionId = "";
      if (sessionId) closeControlSession(sessionId, token);
      mobileKeyboard.blur();
      remoteAudioAvailable = false;
      setConnectionState("disconnected", "Disconnected", false);
      closePeerConnection();
      viewer.pause();
      viewer.srcObject = null;
      fallbackViewer.removeAttribute("src");
      clearTimeout(remoteCursorTimer);
      remoteCursor.style.display = "none";
    }

    function updateRemoteCursor(event) {
      clearTimeout(remoteCursorTimer);
      const p = relativePos(event);
      if (!p) {
        remoteCursor.style.display = "none";
        return null;
      }
      const content = streamContentRect();
      const stageRect = stage.getBoundingClientRect();
      remoteCursor.style.left = `${content.left - stageRect.left + (p.x * content.width)}px`;
      remoteCursor.style.top = `${content.top - stageRect.top + (p.y * content.height)}px`;
      remoteCursor.style.display = connected ? "block" : "none";
      lastRemotePoint = p;
      return p;
    }

    function scheduleTouchCursorHide(event) {
      const isTouch = event.pointerType === "touch" || event.identifier !== undefined;
      if (!connected || fullMouseEnabled() || !isTouch) return;
      clearTimeout(remoteCursorTimer);
      remoteCursorTimer = setTimeout(() => {
        remoteCursor.style.display = "none";
      }, 5000);
    }

    function sendRemoteMove(event) {
      if (connectionState !== "connected") return;
      if (!isRemoteSurfaceEvent(event)) return;
      const p = updateRemoteCursor(event);
      if (!p || !fullMouseEnabled()) return;
      const now = performance.now();
      if (now - lastMoveAt < 30) return;
      lastMoveAt = now;
      sendEvent({ type: "mouse_move", x: p.x, y: p.y });
    }

    function startRemoteDrag(event) {
      if (connectionState !== "connected") return false;
      if (!isRemoteSurfaceEvent(event)) return false;
      if (remoteDrag) return false;
      if (event.button === 2) return false;
      const button = Number.isFinite(Number(event.button)) ? event.button : 0;
      if (event.preventDefault) {
        event.preventDefault();
      }
      const p = updateRemoteCursor(event);
      if (!p) return false;
      if (!fullMouseEnabled()) {
        sendEvent({
          type: "mouse_click",
          x: p.x,
          y: p.y,
          button,
          double: false,
          preserveCursor: true
        });
        scheduleTouchCursorHide(event);
        return false;
      }
      remoteDrag = { button, monitorIndex: selectedMonitorIndex() };
      sendEvent({ type: "mouse_down", x: p.x, y: p.y, button });
      return true;
    }

    function finishRemoteDrag(event) {
      if (!remoteDrag) return;
      if (event && event.preventDefault) {
        event.preventDefault();
      }
      const p = event ? updateRemoteCursor(event) : lastRemotePoint;
      const payload = { type: "mouse_up", button: remoteDrag.button, monitorIndex: remoteDrag.monitorIndex };
      if (p) {
        payload.x = p.x;
        payload.y = p.y;
      }
      sendEvent(payload);
      remoteDrag = null;
    }

    function touchPoint(event) {
      const touches = event.changedTouches || event.touches;
      return touches && touches.length ? touches[0] : null;
    }

    async function loadMonitors() {
      const generation = connectionGeneration;
      const data = await requestJson("/api/monitors", {
        headers: { "X-Auth-Token": token }
      });
      if (generation !== connectionGeneration) return;
      monitorEl.innerHTML = "";
      for (const item of data.monitors || []) {
        const option = document.createElement("option");
        option.value = String(item.index);
        option.dataset.width = String(item.width);
        option.dataset.height = String(item.height);
        option.textContent = `MSS#${item.index} - ${item.name}`;
        if (item.current) option.selected = true;
        monitorEl.appendChild(option);
      }
      monitorsLoaded = monitorEl.options.length > 0;
      renderMonitorPicker();
      if (!monitorsLoaded) throw new Error("No monitor found");
    }

    function setMonitorPanelOpen(open) {
      monitorPanel.classList.toggle("hidden", !open);
      monitorToggle.setAttribute("aria-expanded", String(open));
      keepStageMenuInBounds();
    }

    function renderMonitorPicker() {
      monitorPanel.textContent = "";
      monitorButtons = [];
      let selectedLabel = "Choose\nmonitor";
      for (const option of monitorEl.options) {
        const selected = option.value === monitorEl.value;
        if (selected) selectedLabel = `Monitor\n${option.value}`;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "monitor-option";
        button.textContent = `${option.textContent} (${option.dataset.width} x ${option.dataset.height})`;
        button.setAttribute("aria-pressed", String(selected));
        button.disabled = monitorEl.disabled;
        button.addEventListener("click", async () => {
          if (button.disabled) return;
          setMonitorPanelOpen(false);
          monitorToggle.focus();
          if (option.value !== monitorEl.value) await changeMonitor(Number(option.value));
        });
        monitorButtons.push(button);
        monitorPanel.appendChild(button);
      }
      monitorToggle.textContent = selectedLabel;
    }

    monitorToggle.addEventListener("click", () => {
      if (monitorToggle.disabled) return;
      setMonitorPanelOpen(monitorToggle.getAttribute("aria-expanded") !== "true");
    });
    document.addEventListener("click", (event) => {
      if (!monitorPanel.contains(event.target) && !monitorToggle.contains(event.target)) {
        setMonitorPanelOpen(false);
      }
    });
    controlsBar.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || monitorToggle.getAttribute("aria-expanded") !== "true") return;
      event.preventDefault();
      event.stopPropagation();
      setMonitorPanelOpen(false);
      monitorToggle.focus();
    });

    connectBtn.addEventListener("click", async () => {
      if (connectionState === "connecting" || connectionState === "switching") return;
      if (connected) {
        disconnect();
        return;
      }
      setConnectionState("connecting", "Connecting...");
      const generation = ++connectionGeneration;
      const sessionToken = tokenEl.value.trim();
      try {
        token = sessionToken;
        if (!token) {
          throw new Error("Token required");
        }
        await loadMonitors();
        if (generation !== connectionGeneration) return;
        if (!monitorsLoaded) {
          throw new Error("No monitor found");
        }
        const index = selectedMonitorIndex();
        await requestJson("/api/monitor", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Auth-Token": token },
          body: JSON.stringify({ index })
        });
        if (generation !== connectionGeneration) return;
        const sessionData = await requestJson("/api/session", {
          method: "POST",
          headers: { "X-Auth-Token": sessionToken }
        });
        if (generation !== connectionGeneration) {
          if (sessionData.sessionId) closeControlSession(sessionData.sessionId, sessionToken);
          return;
        }
        if (!sessionData.ok || !sessionData.sessionId) throw new Error("Missing control session");
        controlSessionId = sessionData.sessionId;
        inputQueue = createInputQueue(controlSessionId, sessionToken);
        scheduleHeartbeat(controlSessionId, sessionToken);
        setConnectionState("connecting", "Starting stream...");
        await startSelectedStream();
        if (generation === connectionGeneration && connected) stage.focus();
      } catch (error) {
        if (generation === connectionGeneration) failConnection(`Connect failed: ${error.message}`);
      }
    });

    async function changeMonitor(index) {
      if (!token) return;
      if (connectionState === "connecting" || connectionState === "switching") return;
      finishRemoteDrag(null);
      remoteKeyboard.releaseAll();
      monitorEl.value = String(index);
      renderMonitorPicker();
      const generation = connectionGeneration;
      const wasConnected = connected;
      if (wasConnected) setConnectionState("switching", "Changing monitor...");
      try {
        await requestJson("/api/monitor", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Auth-Token": token },
          body: JSON.stringify({ index })
        });
        if (generation !== connectionGeneration) return;
        if (wasConnected) {
          await startSelectedStream();
        }
      } catch (error) {
        if (generation === connectionGeneration) failConnection(`Monitor change failed: ${error.message}`);
      }
    }

    monitorEl.addEventListener("change", async () => {
      await changeMonitor(Number(monitorEl.value));
    });

    async function toggleFullscreen() {
      try {
        const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
        if (!inFullscreen) {
          if (stage.requestFullscreen) {
            await stage.requestFullscreen();
          } else if (stage.webkitRequestFullscreen) {
            stage.webkitRequestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock("landscape");
            } catch (error) {
              // iOS Safari usually does not support orientation locking from web pages.
            }
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
        updateFullscreenButtons();
      } catch (error) {
        status("Fullscreen failed", false);
      }
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    muteAudioBtn.addEventListener("click", async () => {
      audioMuted = !audioMuted;
      updateAudioButton();
      renderConnectionControls();
      if (usingWebRtc && viewer.srcObject) {
        try {
          await viewer.play();
        } catch (error) {
          status("Audio unmute blocked by browser", false);
        }
      }
    });

    stageMenuToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      if (stageMenuToggle.dataset.dragged === "1") {
        stageMenuToggle.dataset.dragged = "0";
        return;
      }
      setStageMenuOpen(!stageMenu.classList.contains("open"));
    });

    stageMenuToggle.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      event.stopPropagation();
      const stageRect = stage.getBoundingClientRect();
      const menuRect = stageMenu.getBoundingClientRect();
      menuDrag = {
        pointerId: event.pointerId,
        offsetX: event.clientX - menuRect.left,
        offsetY: event.clientY - menuRect.top,
        startX: event.clientX,
        startY: event.clientY
      };
      stageMenuToggle.dataset.dragged = "0";
      stageMenu.classList.add("dragging");
      stageMenuToggle.setPointerCapture(event.pointerId);
      pinStageMenu(menuRect.left - stageRect.left, menuRect.top - stageRect.top);
    });

    stageMenuToggle.addEventListener("pointermove", (event) => {
      if (!menuDrag || menuDrag.pointerId !== event.pointerId) return;
      event.preventDefault();
      const moved = Math.hypot(event.clientX - menuDrag.startX, event.clientY - menuDrag.startY);
      if (moved > 3) stageMenuToggle.dataset.dragged = "1";
      const stageRect = stage.getBoundingClientRect();
      pinStageMenu(
        event.clientX - stageRect.left - menuDrag.offsetX,
        event.clientY - stageRect.top - menuDrag.offsetY
      );
    });

    stageMenuToggle.addEventListener("pointerup", (event) => {
      if (!menuDrag || menuDrag.pointerId !== event.pointerId) return;
      stageMenu.classList.remove("dragging");
      stageMenuToggle.releasePointerCapture(event.pointerId);
      menuDrag = null;
    });

    stageMenuToggle.addEventListener("pointercancel", (event) => {
      if (!menuDrag || menuDrag.pointerId !== event.pointerId) return;
      stageMenu.classList.remove("dragging");
      menuDrag = null;
    });

    stageMenu.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });

    stageMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    stageMenu.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      event.stopPropagation();
    });

    function handleFullscreenChange() {
      updateFullscreenButtons();
    }

    document.addEventListener("fullscreenchange", handleFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
    window.addEventListener("resize", keepStageMenuInBounds);
    updateFullscreenButtons();
    updateAudioButton();
    renderConnectionControls();

    tokenEl.addEventListener("input", () => {
      monitorsLoaded = false;
      monitorEl.innerHTML = "";
      renderMonitorPicker();
      renderConnectionControls();
      if (connected || connectBtn.disabled) {
        disconnect();
      }
    });

    window.addEventListener("pagehide", disconnect);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && (connected || controlSessionId || connectionState === "connecting")) disconnect();
    });

    stage.addEventListener("mousemove", (event) => {
      if (performance.now() - lastTouchAt < 800) return;
      sendRemoteMove(event);
    });

    stage.addEventListener("mousedown", (event) => {
      if (performance.now() - lastTouchAt < 800) return;
      startRemoteDrag(event);
    });

    window.addEventListener("mouseup", (event) => {
      finishRemoteDrag(isRemoteSurfaceEvent(event) ? event : null);
    });

    window.addEventListener("blur", () => {
      finishRemoteDrag(null);
      remoteKeyboard.releaseAll();
    });

    document.addEventListener("focusin", (event) => {
      if (!isRemoteSurfaceEvent(event)) remoteKeyboard.releaseAll();
    });

    stage.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse") return;
      lastTouchAt = performance.now();
      if (startRemoteDrag(event)) {
        remoteDrag.pointerId = event.pointerId;
        stage.setPointerCapture(event.pointerId);
      }
    });

    stage.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse") return;
      if (remoteDrag && remoteDrag.pointerId === event.pointerId) {
        event.preventDefault();
        sendRemoteMove(event);
      }
    });

    stage.addEventListener("pointerup", (event) => {
      if (event.pointerType === "mouse") return;
      lastTouchAt = performance.now();
      if (!remoteDrag || remoteDrag.pointerId !== event.pointerId) return;
      finishRemoteDrag(event);
      stage.releasePointerCapture(event.pointerId);
    });

    stage.addEventListener("pointercancel", (event) => {
      if (event.pointerType === "mouse") return;
      if (!remoteDrag || remoteDrag.pointerId !== event.pointerId) return;
      finishRemoteDrag(event);
    });

    stage.addEventListener("touchstart", (event) => {
      if (window.PointerEvent) return;
      if (stageMenu.contains(event.target) || event.target === mobileKeyboard) return;
      const touch = touchPoint(event);
      if (!touch || !connected || !relativePos(touch)) return;
      lastTouchAt = performance.now();
      // Suppress Safari's compatibility mouse event even in click-only mode.
      event.preventDefault();
      if (startRemoteDrag(touch)) {
        remoteDrag.touchId = touch.identifier;
      }
    }, { passive: false });

    stage.addEventListener("touchmove", (event) => {
      if (window.PointerEvent || !remoteDrag) return;
      const touch = touchPoint(event);
      if (!touch || touch.identifier !== remoteDrag.touchId) return;
      event.preventDefault();
      sendRemoteMove(touch);
    }, { passive: false });

    stage.addEventListener("touchend", (event) => {
      if (window.PointerEvent) return;
      if (stageMenu.contains(event.target) || event.target === mobileKeyboard) return;
      if (performance.now() - lastTouchAt < 800) {
        lastTouchAt = performance.now();
        event.preventDefault();
      }
      if (!remoteDrag) return;
      const touch = touchPoint(event);
      if (!touch || touch.identifier !== remoteDrag.touchId) return;
      event.preventDefault();
      finishRemoteDrag(touch);
    }, { passive: false });

    stage.addEventListener("touchcancel", (event) => {
      if (window.PointerEvent || !remoteDrag) return;
      const touch = touchPoint(event);
      if (touch && touch.identifier !== remoteDrag.touchId) return;
      event.preventDefault();
      finishRemoteDrag(touch || null);
    }, { passive: false });

    stage.addEventListener("click", (event) => {
      if (!isRemoteSurfaceEvent(event)) return;
      event.preventDefault();
    });

    stage.addEventListener("contextmenu", (event) => {
      if (!isRemoteSurfaceEvent(event)) return;
      event.preventDefault();
      const p = updateRemoteCursor(event);
      if (!p) return;
      sendEvent({
        type: "mouse_click",
        x: p.x,
        y: p.y,
        button: 2,
        double: false,
        preserveCursor: !fullMouseEnabled()
      });
      scheduleTouchCursorHide(event);
    });

    stage.addEventListener("dblclick", (event) => {
      if (!isRemoteSurfaceEvent(event)) return;
      // The two preceding presses already produce a remote double-click.
      event.preventDefault();
    });

    stage.addEventListener("wheel", (event) => {
      if (!isRemoteSurfaceEvent(event)) return;
      event.preventDefault();
      if (!relativePos(event)) return;
      const amount = Math.round(-event.deltaY);
      sendEvent({ type: "scroll", amount });
    }, { passive: false });

    stage.addEventListener("mouseleave", () => {
      clearTimeout(remoteCursorTimer);
      remoteCursor.style.display = "none";
    });

    function isRemoteSurfaceEvent(event) {
      const target = event.target;
      return !target || target === window || (!stageMenu.contains(target) && !controlsBar.contains(target) &&
        target !== mobileKeyboard);
    }

    function shouldCaptureKey(event) {
      if (connectionState !== "connected") return false;
      const target = event.target;
      if (!isRemoteSurfaceEvent(event)) return false;
      if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement) {
        return false;
      }
      return true;
    }

    mobileKeyboard.addEventListener("beforeinput", (event) => {
      if (!connected) return;
      if (event.inputType === "deleteContentBackward") {
        event.preventDefault();
        sendEvent({ type: "key", key: "backspace", action: "tap" });
      } else if (event.inputType === "insertLineBreak") {
        event.preventDefault();
        sendEvent({ type: "key", key: "enter", action: "tap" });
      }
    });

    mobileKeyboard.addEventListener("input", () => {
      if (!connected) return;
      sendTextInput(mobileKeyboard.value);
      mobileKeyboard.value = "";
    });

    mobileKeyboard.addEventListener("keydown", (event) => {
      if (!connected) return;
      if (event.ctrlKey || event.altKey || event.metaKey ||
          event.key === "Control" || event.key === "Alt" || event.key === "Meta") {
        if (remoteKeyboard.down(event)) event.preventDefault();
        return;
      }
      if (event.key === "Backspace" || event.key === "Enter") {
        event.preventDefault();
        sendEvent({ type: "key", key: event.key, action: "tap" });
        mobileKeyboard.value = "";
      }
    });

    document.addEventListener("keydown", (event) => {
      if (!shouldCaptureKey(event)) return;
      if (remoteKeyboard.down(event)) event.preventDefault();
    });

    document.addEventListener("keyup", (event) => {
      if (connected && remoteKeyboard.up(event)) event.preventDefault();
    });

    fallbackViewer.addEventListener("error", () => {
      if (connected && !usingWebRtc) failConnection("Stream error (token or server)");
    });

    viewer.addEventListener("error", () => {
      if (connected && usingWebRtc) failConnection("WebRTC media error");
    });
  </script>
</body>
</html>
